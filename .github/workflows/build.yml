name: Build

env:
  GO_VERSION: "1.25.8"

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  go-tests:
    name: Go tests (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./admin/go.mod
      - name: Hermetic tests
        run: make test-go-hermetic

  go-tests-mysql-compatibility:
    name: Go tests (MySQL 5.7 compatibility)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: casdoor
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./admin/go.mod
      - name: MySQL compatibility tests
        env:
          AICODEX_TEST_DB_DSN: root:123456@tcp(127.0.0.1:3306)/casdoor?parseTime=true
        run: make test-go-integration-mysql

  go-tests-postgres-integration:
    name: Go tests (PostgreSQL integration status)
    runs-on: ubuntu-latest
    env:
      RUN_POSTGRES_INTEGRATION: ${{ vars.AICODEX_RUN_POSTGRES_INTEGRATION }}
      AICODEX_TEST_DB_DSN: ${{ secrets.AICODEX_TEST_POSTGRES_DSN }}
    steps:
      - name: Record PostgreSQL integration not run
        if: env.RUN_POSTGRES_INTEGRATION != 'true'
        run: |
          echo "### PostgreSQL integration: NOT_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow requires separate release-candidate PostgreSQL evidence unless AICODEX_RUN_POSTGRES_INTEGRATION=true." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v3
        if: env.RUN_POSTGRES_INTEGRATION == 'true'
      - uses: actions/setup-go@v4
        if: env.RUN_POSTGRES_INTEGRATION == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./admin/go.mod
      - name: Check PostgreSQL integration prerequisites
        if: env.RUN_POSTGRES_INTEGRATION == 'true'
        shell: bash
        run: |
          if [[ -z "${AICODEX_TEST_DB_DSN:-}" ]]; then
            echo "::error::Missing secret AICODEX_TEST_POSTGRES_DSN while PostgreSQL integration is enabled."
            exit 1
          fi
      - name: PostgreSQL schema registry integration
        id: postgres_integration
        if: env.RUN_POSTGRES_INTEGRATION == 'true'
        run: make test-go-integration-postgres
      - name: Record PostgreSQL integration result
        if: always() && env.RUN_POSTGRES_INTEGRATION == 'true'
        env:
          TEST_OUTCOME: ${{ steps.postgres_integration.outcome }}
        run: |
          echo "### PostgreSQL integration: ${TEST_OUTCOME:-not-run}" >> "$GITHUB_STEP_SUMMARY"

  frontend-checks:
    name: Front-end checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun run deps:install
        working-directory: ./web-admin
      - name: Typecheck
        run: bun run typecheck
        working-directory: ./web-admin
      - name: Build tooling typecheck
        run: bun run typecheck:build-tooling
        working-directory: ./web-admin
      - name: Resolve incremental TypeScript gate base
        id: ts-gate-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          is_commit() {
            local sha="$1"
            [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] &&
              [[ ! "$sha" =~ ^0{40}$ ]] &&
              git cat-file -e "$sha^{commit}" 2>/dev/null
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            if ! is_commit "$base_sha"; then
              base_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          fi

          if ! is_commit "$base_sha"; then
            echo "::error::Unable to resolve an incremental TypeScript gate base revision." >&2
            exit 1
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Incremental TypeScript gate
        env:
          BASE_SHA: ${{ steps.ts-gate-base.outputs.base_sha }}
        run: node scripts/check-incremental-typescript-gate.mjs --base "$BASE_SHA"
        working-directory: ./web-admin
      - name: Public auth scripts check
        run: bun run public-scripts:check
        working-directory: ./web-admin
      - name: Public auth scripts build
        run: bun run public-scripts:build
        working-directory: ./web-admin
      - name: Public auth scripts smoke
        run: bun run public-scripts:smoke
        working-directory: ./web-admin
      - name: Production source lint
        run: bun run lint
        working-directory: ./web-admin
      - name: Vitest
        run: bun run test:ci
        working-directory: ./web-admin

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    needs: [go-tests, frontend-checks]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun run deps:install
        working-directory: ./web-admin
      - name: Build front-end
        run: CI=false bun run build
        working-directory: ./web-admin
      - name: Upload build artifacts
        if: github.repository == 'casdoor/casdoor' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: ./web-admin/build

  backend:
    name: Back-end
    runs-on: ubuntu-latest
    needs: [go-tests, go-tests-mysql-compatibility]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./admin/go.mod
      - run: go version
      - name: Build
        run: |
          go build -race -ldflags "-extldflags '-static'"
        working-directory: ./admin

  linter:
    name: Go-Linter
    runs-on: ubuntu-latest
    needs: [go-tests]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Sync vendor tree
        run: go mod vendor
        working-directory: ./admin

      # CI and local `make lint` both use the repo's gofumpt + govet golangci-lint config.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.11.4
          args: --config ../.golangci.yml ./...
          working-directory: admin

  e2e:
    name: e2e-test
    runs-on: ubuntu-latest
    needs: [go-tests]
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: aicodex_admin
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./admin/go.mod
      - name: Start disposable backend
        env:
          logConfig: '{"adapter":"console"}'
        run: nohup go run ./main.go > /tmp/backend.log 2>&1 &
        working-directory: ./admin
      - name: Wait for disposable backend readiness
        run: |
          set -euo pipefail
          echo "Waiting for disposable backend on loopback port 8000..."
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Disposable backend is ready."
              exit 0
            fi
            if [ $i -eq 60 ]; then
              echo "Disposable backend failed to start within 60 seconds."
              tail -n 200 /tmp/backend.log || true
              exit 1
            fi
            sleep 1
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install front-end dependencies
        run: bun run deps:install
        working-directory: ./web-admin
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web-admin/bun.lock') }}
      - name: Install Playwright Chromium
        run: bun x --no-install playwright install --with-deps chromium
        working-directory: ./web-admin
      - name: Playwright E2E typecheck
        run: bun run typecheck:e2e
        working-directory: ./web-admin
      - name: Run Playwright E2E
        env:
          AICODEX_ADMIN_E2E_DISPOSABLE_DB: "1"
        run: bun run test:e2e
        working-directory: ./web-admin
      - name: Upload Playwright failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-e2e-${{ github.run_id }}
          path: ./web-admin/output/playwright
          if-no-files-found: ignore
          retention-days: 7

  tag-release:
    name: Create Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    if: github.repository == 'casdoor/casdoor' && github.event_name == 'push'
    needs: [frontend, backend, linter, e2e]
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Tag with Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    if: github.repository == 'casdoor/casdoor' && github.event_name == 'push' && needs.tag-release.outputs.new-release-published == 'true'
    needs: [tag-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./admin/go.mod

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: ./web-admin/build

      - name: Prepare Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/gomod" >> $GITHUB_ENV
          echo "GOCACHE=$RUNNER_TEMP/gocache" >> $GITHUB_ENV
          go clean -cache -modcache -testcache -fuzzcache

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    name: Docker Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    if: github.repository == 'casdoor/casdoor' && github.event_name == 'push' && needs.tag-release.outputs.new-release-published == 'true'
    needs: [tag-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: -1

      - name: Fetch Previous version
        id: get-previous-tag
        uses: actions-ecosystem/action-get-latest-tag@v1.6.0

      - name: Decide Should_Push Or Not
        id: should_push
        run: |
          old_version=${{steps.get-previous-tag.outputs.tag}}
          new_version=${{ needs.tag-release.outputs.new-release-version }}

          old_array=(${old_version//\./ })
          new_array=(${new_version//\./ })

          if [ ${old_array[0]} != ${new_array[0]} ]
          then 
              echo ::set-output name=push::'true'
          elif [ ${old_array[1]} != ${new_array[1]} ]
          then 
              echo ::set-output name=push::'true'
          else
              echo ::set-output name=push::'false'
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          version: latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        if: github.repository == 'casdoor/casdoor' && github.event_name == 'push' && steps.should_push.outputs.push=='true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v3
        if: github.repository == 'casdoor/casdoor' && github.event_name == 'push' && steps.should_push.outputs.push=='true'
        with:
          context: .
          target: STANDARD
          platforms: linux/amd64,linux/arm64
          push: true
          tags: casbin/casdoor:${{ needs.tag-release.outputs.new-release-version }},casbin/casdoor:latest

      - name: Push All In One Version to Docker Hub
        uses: docker/build-push-action@v3
        if: github.repository == 'casdoor/casdoor' && github.event_name == 'push' && steps.should_push.outputs.push=='true'
        with:
          context: .
          target: ALLINONE
          platforms: linux/amd64,linux/arm64
          push: true
          tags: casbin/casdoor-all-in-one:${{ needs.tag-release.outputs.new-release-version }},casbin/casdoor-all-in-one:latest

      - uses: actions/checkout@v3
        if: steps.should_push.outputs.push=='true'
        with:
          repository: casdoor/casdoor-helm
          ref: "master"
          token: ${{ secrets.GH_BOT_TOKEN }}

      - name: Update Helm Chart
        if: steps.should_push.outputs.push=='true'
        run: |
          # Set the appVersion and version of the chart to the current tag
          sed -i "s/appVersion: .*/appVersion: ${{ needs.tag-release.outputs.new-release-version }}/g" ./charts/casdoor/Chart.yaml
          sed -i "s/version: .*/version: ${{ needs.tag-release.outputs.new-release-version }}/g" ./charts/casdoor/Chart.yaml

          REGISTRY=oci://registry-1.docker.io/casbin
          cd charts/casdoor
          helm package .
          PKG_NAME=$(ls *.tgz)
          helm repo index . --url $REGISTRY --merge index.yaml
          helm push $PKG_NAME $REGISTRY
          rm $PKG_NAME

          # Commit and push the changes back to the repository
          git config --global user.name "casbin-bot"
          git config --global user.email "bot@casbin.org"
          git add Chart.yaml index.yaml
          git commit -m "chore(helm): bump helm charts appVersion to ${{ needs.tag-release.outputs.new-release-version }}"
          git tag ${{ needs.tag-release.outputs.new-release-version }}
          git push origin HEAD:master --follow-tags
