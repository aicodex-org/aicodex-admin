info:
  name: Controlled Smoke Execution Handoff
  type: http
  seq: 8
  tags:
    - smoke
    - wecom-sync
    - source-readiness
    - controlled-smoke
    - execution-handoff
    - readonly

http:
  method: GET
  url: "http://127.0.0.1/__local_only_wecom_source_controlled_smoke_execution_handoff__"

runtime:
  scripts:
    - type: before-request
      code: |-
        function loadControlledSmokeExecutionHandoff() {
          try {
            return require("../scripts/wecomSourceControlledSmokeExecutionHandoff")
          } catch (error) {
            return require("./scripts/wecomSourceControlledSmokeExecutionHandoff")
          }
        }

        function varValue(name, fallback) {
          const value = bru.getVar(name) || bru.getEnvVar(name)
          return value === undefined || value === null || value === "" ? fallback : value
        }

        function parseJsonVar(name) {
          const raw = bru.getVar(name) || bru.getEnvVar(name)
          if (!raw) {
            return undefined
          }
          return typeof raw === "string" ? JSON.parse(raw) : raw
        }

        function boolVar(name) {
          return String(bru.getVar(name) || bru.getEnvVar(name) || "").toLowerCase() === "true"
        }

        function summaryFromAlias(alias, readyStatus) {
          if (!alias) {
            return undefined
          }
          return {
            status: readyStatus || alias,
            aliases: [alias],
            reasonAlias: alias,
          }
        }

        const {createWecomSourceControlledSmokeExecutionHandoff} = loadControlledSmokeExecutionHandoff()
        const handoff = createWecomSourceControlledSmokeExecutionHandoff({
          preflightSummary: parseJsonVar("wecomSourceControlledSmokeExecutionPreflightSummary") || summaryFromAlias(varValue("wecomSourceControlledSmokeExecutionPreflightAlias", undefined), "ready-for-wecom-controlled-smoke-preflight"),
          evidenceHandoff: parseJsonVar("wecomSourceControlledSmokeExecutionEvidenceHandoff") || summaryFromAlias(varValue("wecomSourceControlledSmokeExecutionEvidenceAlias", undefined), "ready-for-controlled-smoke-evidence-handoff"),
          remediationHandoff: parseJsonVar("wecomSourceControlledSmokeExecutionRemediationHandoff") || summaryFromAlias(varValue("wecomSourceControlledSmokeExecutionRemediationAlias", undefined), "ready"),
          redactionSignal: varValue("wecomSourceControlledSmokeExecutionRedactionSignal", "redacted"),
          blockingAlias: varValue("wecomSourceControlledSmokeExecutionBlockingAlias", "none"),
          operatorScope: varValue("wecomSourceControlledSmokeExecutionOperatorScope", "local-readonly-controlled-smoke-execution-handoff"),
          executionModeAlias: varValue("wecomSourceControlledSmokeExecutionModeAlias", "controlled-smoke-execution-handoff-only"),
          realExecutionSignal: boolVar("wecomSourceControlledSmokeExecutionRealExecutionSignal"),
          executionMetadata: parseJsonVar("wecomSourceControlledSmokeExecutionMetadata"),
          operatorNote: varValue("wecomSourceControlledSmokeExecutionOperatorNote", undefined),
        }, {
          sourceAlias: varValue("wecomSourceControlledSmokeExecutionSourceAlias", undefined),
        })

        console.log(JSON.stringify(handoff, null, 2))
        if (handoff.status !== "ready-for-controlled-smoke-execution-handoff" && boolVar("wecomSourceControlledSmokeExecutionRequireReady")) {
          throw new Error(`wecom source controlled smoke execution handoff blocked reasonAlias=${handoff.reasonAlias}`)
        }

        throw new Error(`local-only WeCom source controlled smoke execution handoff completed status=${handoff.status}; HTTP request intentionally aborted`)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
