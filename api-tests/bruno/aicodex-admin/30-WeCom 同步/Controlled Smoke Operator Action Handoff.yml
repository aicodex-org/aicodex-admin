info:
  name: Controlled Smoke Operator Action Handoff
  type: http
  seq: 12
  tags:
    - smoke
    - wecom-sync
    - source-readiness
    - controlled-smoke
    - operator-action
    - readonly
    - local-only

http:
  method: GET
  url: "http://127.0.0.1/__local_only_wecom_source_controlled_smoke_operator_action_handoff__"

runtime:
  scripts:
    - type: before-request
      code: |-
        function loadControlledSmokeOperatorActionHandoff() {
          try {
            return require("../scripts/wecomSourceControlledSmokeOperatorActionHandoff")
          } catch (error) {
            return require("./scripts/wecomSourceControlledSmokeOperatorActionHandoff")
          }
        }

        function parseJsonVar(name) {
          const raw = bru.getVar(name) || bru.getEnvVar(name)
          if (!raw) {
            return undefined
          }
          return typeof raw === "string" ? JSON.parse(raw) : raw
        }

        function boolVar(name) {
          return String(bru.getVar(name) || bru.getEnvVar(name) || "").toLowerCase() === "true"
        }

        const {createWecomSourceControlledSmokeOperatorActionHandoff} = loadControlledSmokeOperatorActionHandoff()
        const handoff = createWecomSourceControlledSmokeOperatorActionHandoff({
          operatorDecisionHandoffSummary: parseJsonVar("wecomSourceControlledSmokeOperatorActionDecisionHandoff"),
          operatorMetadata: parseJsonVar("wecomSourceControlledSmokeOperatorActionMetadata"),
          operatorNote: bru.getVar("wecomSourceControlledSmokeOperatorActionNote") || bru.getEnvVar("wecomSourceControlledSmokeOperatorActionNote"),
        }, {
          sourceAlias: bru.getVar("wecomSourceControlledSmokeOperatorActionSourceAlias") || bru.getEnvVar("wecomSourceControlledSmokeOperatorActionSourceAlias") || "bruno-wecom-source-controlled-smoke-operator-action-handoff",
        })

        console.log(JSON.stringify(handoff, null, 2))
        if (handoff.actionStatus !== "ready-for-operator-action" && boolVar("wecomSourceControlledSmokeOperatorActionRequireReady")) {
          throw new Error(`wecom source controlled smoke operator action handoff blocked status=${handoff.actionStatus} blocker=${handoff.blockerAlias}`)
        }

        throw new Error(`local-only WeCom source controlled smoke operator action handoff completed status=${handoff.actionStatus}; HTTP request intentionally aborted`)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
