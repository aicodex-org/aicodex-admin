info:
  name: Operator Remediation Handoff
  type: http
  seq: 7
  tags:
    - smoke
    - wecom-sync
    - source-readiness
    - operator-remediation
    - handoff
    - readonly

http:
  method: GET
  url: "http://127.0.0.1/__local_only_wecom_source_operator_remediation_handoff__"

runtime:
  scripts:
    - type: before-request
      code: |-
        function loadOperatorRemediationHandoff() {
          try {
            return require("../scripts/wecomSourceOperatorRemediationHandoff")
          } catch (error) {
            return require("./scripts/wecomSourceOperatorRemediationHandoff")
          }
        }

        function varValue(name, fallback) {
          const value = bru.getVar(name) || bru.getEnvVar(name)
          return value === undefined || value === null || value === "" ? fallback : value
        }

        function parseJsonVar(name) {
          const raw = bru.getVar(name) || bru.getEnvVar(name)
          if (!raw) {
            return undefined
          }
          return typeof raw === "string" ? JSON.parse(raw) : raw
        }

        function boolVar(name) {
          return String(bru.getVar(name) || bru.getEnvVar(name) || "").toLowerCase() === "true"
        }

        function summaryFromAlias(alias, readyStatus) {
          if (!alias) {
            return undefined
          }
          return {
            status: readyStatus || alias,
            aliases: [alias],
            reasonAlias: alias,
          }
        }

        const {createWecomSourceOperatorRemediationHandoff} = loadOperatorRemediationHandoff()
        const handoff = createWecomSourceOperatorRemediationHandoff({
          readinessSummary: parseJsonVar("wecomSourceOperatorRemediationReadinessSummary") || summaryFromAlias(varValue("wecomSourceOperatorRemediationReadinessAlias", undefined), "ready"),
          releaseDecision: parseJsonVar("wecomSourceOperatorRemediationReleaseDecision") || summaryFromAlias(varValue("wecomSourceOperatorRemediationReleaseAlias", undefined), "ready"),
          controlledSmokePreflight: parseJsonVar("wecomSourceOperatorRemediationPreflightSummary") || summaryFromAlias(varValue("wecomSourceOperatorRemediationPreflightAlias", undefined), "ready-for-wecom-controlled-smoke-preflight"),
          evidenceHandoff: parseJsonVar("wecomSourceOperatorRemediationEvidenceHandoff") || summaryFromAlias(varValue("wecomSourceOperatorRemediationEvidenceAlias", undefined), "ready-for-controlled-smoke-evidence-handoff"),
          redactionSignal: varValue("wecomSourceOperatorRemediationRedactionSignal", "redacted"),
          blockingAliases: parseJsonVar("wecomSourceOperatorRemediationBlockingAliases") || [],
          operatorScope: varValue("wecomSourceOperatorRemediationOperatorScope", "local-readonly-operator-remediation-handoff"),
          realEnvironmentWriteSignal: boolVar("wecomSourceOperatorRemediationRealWriteSignal"),
          operatorMetadata: parseJsonVar("wecomSourceOperatorRemediationOperatorMetadata"),
          operatorNote: varValue("wecomSourceOperatorRemediationOperatorNote", undefined),
        }, {
          sourceAlias: varValue("wecomSourceOperatorRemediationSourceAlias", undefined),
        })

        console.log(JSON.stringify(handoff, null, 2))
        if (handoff.status !== "ready" && boolVar("wecomSourceOperatorRemediationRequireReady")) {
          throw new Error(`wecom source operator remediation handoff blocked reasonAlias=${handoff.reasonAlias}`)
        }

        throw new Error(`local-only WeCom source operator remediation handoff completed status=${handoff.status}; HTTP request intentionally aborted`)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
