info:
  name: Source Release Decision
  type: http
  seq: 4
  tags:
    - smoke
    - wecom-sync
    - source-readiness
    - release-decision
    - handoff
    - readonly

http:
  method: GET
  url: "{{baseUrl}}/api/wecom-org-sync/config?organization={{wecomOrganization}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("wecomOrganization") && !bru.getEnvVar("wecomOrganization")) {
          throw new Error("请先设置 wecomOrganization，或先执行 20-基础只读/组织列表.yml 自动发现 wecom-* 组织。")
        }
    - type: after-response
      code: |-
        function loadSourceReadinessHandoff() {
          try {
            return require("../scripts/wecomSourceReadinessHandoff")
          } catch (error) {
            return require("./scripts/wecomSourceReadinessHandoff")
          }
        }

        function loadSourceReleaseDecision() {
          try {
            return require("../scripts/wecomSourceReleaseDecision")
          } catch (error) {
            return require("./scripts/wecomSourceReleaseDecision")
          }
        }

        function parseJsonVar(name) {
          const raw = bru.getVar(name) || bru.getEnvVar(name)
          if (!raw) {
            return undefined
          }
          return typeof raw === "string" ? JSON.parse(raw) : raw
        }

        function boolVar(name) {
          return String(bru.getVar(name) || bru.getEnvVar(name) || "").toLowerCase() === "true"
        }

        function sanitizeConfigResponse(json) {
          const config = json?.data?.config || {}
          return {
            status: json?.status,
            data: {
              organization: json?.data?.organization ? "present" : "",
              isConfigured: json?.data?.isConfigured === true,
              config: {
                organization: config.organization ? "present" : "",
                corpId: config.corpId ? "present" : "",
                addressBookSecret: config.addressBookSecret ? "***" : "",
                isEnabled: config.isEnabled === true,
              },
            },
          }
        }

        const status = res.getStatus()
        const body = res.getBody()
        const json = typeof body === "string" ? JSON.parse(body) : body
        if (status !== 200 || json?.status !== "ok") {
          throw new Error(`admin WeCom source release decision 配置响应异常。status=${status} statusField=${json?.status}`)
        }

        const {createWecomSourceReadinessHandoff} = loadSourceReadinessHandoff()
        const {createWecomSourceReleaseDecision} = loadSourceReleaseDecision()
        const sourceReadinessHandoff = createWecomSourceReadinessHandoff({
          configResponse: sanitizeConfigResponse(json),
          runsResponse: parseJsonVar("wecomSourceReadinessRunsResponse"),
          connectionTestResponse: parseJsonVar("wecomSourceReadinessConnectionTestResponse"),
        }, {
          recentSuccessWindowHours: bru.getVar("wecomSourceReadinessRecentSuccessWindowHours") || bru.getEnvVar("wecomSourceReadinessRecentSuccessWindowHours"),
        })
        const decision = createWecomSourceReleaseDecision({
          sourceReadinessHandoff,
          operatorMetadata: parseJsonVar("wecomSourceReleaseDecisionOperatorMetadata"),
        }, {
          sourceAlias: bru.getVar("wecomSourceReleaseDecisionSourceAlias") || bru.getEnvVar("wecomSourceReleaseDecisionSourceAlias"),
        })

        console.log(JSON.stringify(decision, null, 2))
        if (decision.status !== "ready" && boolVar("wecomSourceReleaseDecisionRequireReady")) {
          throw new Error(`wecom source release decision blocked reasonAlias=${decision.reasonAlias}`)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
