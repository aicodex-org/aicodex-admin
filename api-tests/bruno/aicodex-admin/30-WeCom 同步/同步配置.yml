info:
  name: 同步配置
  type: http
  seq: 1
  tags:
    - smoke
    - wecom-sync
    - readonly

http:
  method: GET
  url: "{{baseUrl}}/api/wecom-org-sync/config?organization={{wecomOrganization}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("wecomOrganization") && !bru.getEnvVar("wecomOrganization")) {
          throw new Error("请先设置 wecomOrganization，或先执行 20-基础只读/组织列表.yml 自动发现 wecom-* 组织。")
        }
    - type: after-response
      code: |-
        const status = res.getStatus()
        const body = res.getBody()
        const json = typeof body === "string" ? JSON.parse(body) : body
        if (status !== 200 || json?.status !== "ok" || !json?.data?.organization) {
          throw new Error(`admin WeCom 同步配置响应异常。status=${status} body=${JSON.stringify(json)}`)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
