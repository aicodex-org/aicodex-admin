info:
  name: 刷新状态
  type: http
  seq: 2
  tags:
    - smoke
    - organization-tree-operations
    - readonly

http:
  method: POST
  url: "{{baseUrl}}/api/organization-tree-operations/refresh"
  headers:
    - name: Content-Type
      value: application/json
      enabled: true
  body:
    type: json
    data: |-
      {
        "organization": "{{organizationTreeOperationsOrganization}}",
        "triggerType": "refresh_status"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const organization = bru.getVar("organizationTreeOperationsOrganization") || bru.getEnvVar("organizationTreeOperationsOrganization") || bru.getVar("wecomOrganization") || bru.getEnvVar("wecomOrganization")
        if (!organization) {
          throw new Error("请设置 organizationTreeOperationsOrganization 或 wecomOrganization。该请求只刷新诊断状态，不触发 read model 重建。")
        }
        bru.setVar("organizationTreeOperationsOrganization", String(organization))
    - type: after-response
      code: |-
        const status = res.getStatus()
        const body = res.getBody()
        const json = typeof body === "string" ? JSON.parse(body) : body
        const data = json?.data
        if (status !== 200 || json?.status !== "ok" || data?.triggerType !== "refresh_status") {
          throw new Error(`admin 组织树运营刷新状态响应异常。status=${status} statusField=${json?.status}`)
        }
        if (data.status !== "ok" || !data.traceId || !data.diagnostics?.summary) {
          throw new Error(`admin 组织树运营刷新状态未返回稳定诊断。operationStatus=${data?.status || ""}`)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
