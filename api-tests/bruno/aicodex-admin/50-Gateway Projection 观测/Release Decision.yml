info:
  name: Release Decision
  type: http
  seq: 3
  tags:
    - smoke
    - gateway-projection
    - release-decision
    - readonly

http:
  method: GET
  url: "{{baseUrl}}/api/gateway-projection/observability"

runtime:
  scripts:
    - type: after-response
      code: |-
        function loadDecision() {
          try {
            return require("../scripts/gatewayProjectionReleaseDecision")
          } catch (error) {
            return require("./scripts/gatewayProjectionReleaseDecision")
          }
        }

        function parseJsonVar(name) {
          const raw = bru.getVar(name) || bru.getEnvVar(name)
          if (!raw) {
            return undefined
          }
          return typeof raw === "string" ? JSON.parse(raw) : raw
        }

        function boolVar(name) {
          return String(bru.getVar(name) || bru.getEnvVar(name) || "").toLowerCase() === "true"
        }

        const status = res.getStatus()
        const body = res.getBody()
        const observabilityResponse = typeof body === "string" ? JSON.parse(body) : body
        if (status !== 200) {
          throw new Error(`admin gateway projection release decision 响应异常。status=${status} statusField=${observabilityResponse?.status}`)
        }

        const {createGatewayProjectionReleaseDecisionHandoff} = loadDecision()
        const handoff = createGatewayProjectionReleaseDecisionHandoff({
          observabilityResponse,
          mappingReadinessResponse: parseJsonVar("gatewayProjectionMappingReadinessResponse"),
        }, {
          requireLatestAudit: boolVar("gatewayProjectionRequireLatestAudit"),
          requireMappingReadiness: boolVar("gatewayProjectionRequireMappingReadiness"),
          minSubjectCount: bru.getVar("gatewayProjectionMinSubjectCount") || bru.getEnvVar("gatewayProjectionMinSubjectCount"),
          minTombstoneSubjectCount: bru.getVar("gatewayProjectionMinTombstoneSubjectCount") || bru.getEnvVar("gatewayProjectionMinTombstoneSubjectCount"),
          sourceAlias: bru.getVar("gatewayProjectionReleaseDecisionSourceAlias") || bru.getEnvVar("gatewayProjectionReleaseDecisionSourceAlias") || "bruno-release-decision",
        })

        console.log(JSON.stringify(handoff, null, 2))
        if (handoff.status !== "ready" && boolVar("gatewayProjectionRequireReleaseDecisionReady")) {
          throw new Error(`projection release decision blocked decision=${handoff.decision} aliases=${handoff.aliases.join("|") || "none"}`)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
