x-logging-defaults: &logging-defaults
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  aicodex-admin:
    restart: always
    image: ${AICODEX_ADMIN_IMAGE:-aicodex-admin:latest}
    entrypoint: /bin/sh -c 'exec ./server --createDatabase=${AICODEX_CREATE_DATABASE:-false}'
    environment:
      RUNNING_IN_DOCKER: "true"
      driverName: ${AICODEX_DB_DRIVER:-postgres}
      dbName: ${AICODEX_DB_NAME:-aicodex_admin}
      dataSourceName: "user=${AICODEX_DB_USER:?set AICODEX_DB_USER in env file} password=${AICODEX_DB_PASSWORD:?set AICODEX_DB_PASSWORD in env file} host=${AICODEX_DB_HOST:?set AICODEX_DB_HOST in env file} port=${AICODEX_DB_PORT:-5432} sslmode=${AICODEX_DB_SSLMODE:-disable} dbname=${AICODEX_DB_NAME:-aicodex_admin} ${AICODEX_DB_EXTRA_OPTIONS:-}"
      # 默认语言只影响首次访问或无痕窗口，用户仍可在页面上手动切换语言。
      defaultLanguage: ${AICODEX_ADMIN_DEFAULT_LANGUAGE:-zh}
      # Insight provider 校验 bearer token 时使用这些白名单，生产环境必须显式配置 audience。
      insightProviderAllowedAudiences: ${AICODEX_INSIGHT_PROVIDER_ALLOWED_AUDIENCES:-}
      insightProviderAllowedIssuers: ${AICODEX_INSIGHT_PROVIDER_ALLOWED_ISSUERS:-}
      insightProviderRequiredScopes: ${AICODEX_INSIGHT_PROVIDER_REQUIRED_SCOPES:-}
      # Insight 用量身份 resolver；endpoint/token 为空时保持现有手工映射行为。
      insightUsageIdentityResolverEndpoint: ${AICODEX_INSIGHT_USAGE_IDENTITY_RESOLVER_ENDPOINT:-}
      insightUsageIdentityResolverToken: ${AICODEX_INSIGHT_USAGE_IDENTITY_RESOLVER_TOKEN:-}
      insightUsageIdentityResolverCaller: ${AICODEX_INSIGHT_USAGE_IDENTITY_RESOLVER_CALLER:-aicodex-admin}
      insightUsageIdentityResolverMaxItems: ${AICODEX_INSIGHT_USAGE_IDENTITY_RESOLVER_MAX_ITEMS:-200}
      insightUsageIdentityResolverTimeoutMs: ${AICODEX_INSIGHT_USAGE_IDENTITY_RESOLVER_TIMEOUT_MS:-5000}
    ports:
      - "${AICODEX_ADMIN_HTTP_PORT:-8000}:8000"
    volumes:
      # 本地文件系统 Storage Provider 会把头像等上传资源写入容器内 /files。
      - ${AICODEX_ADMIN_UPLOAD_DIR:-./data/upload-files}:/files
      # 应用文件日志和临时文件落到运行目录，避免容器重建后丢失应用日志。
      - ${AICODEX_ADMIN_LOG_DIR:-./runtime/logs}:/logs
      - ${AICODEX_ADMIN_TMP_DIR:-./runtime/tmp}:/tmp
    logging: *logging-defaults
